name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows installer + portable'
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release (requires both platforms)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      # Signing credentials live in repository secrets. The keystore is restored
      # from a base64 secret at build time and never committed.
      WORDNEST_KEYSTORE_PATH: ${{ github.workspace }}\signing.jks
      WORDNEST_STORE_PASSWORD: ${{ secrets.WORDNEST_STORE_PASSWORD }}
      WORDNEST_KEY_ALIAS: ${{ secrets.WORDNEST_KEY_ALIAS }}
      WORDNEST_KEY_PASSWORD: ${{ secrets.WORDNEST_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore signing keystore from secret
        if: ${{ github.event_name == 'push' || inputs.build_android }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:GITHUB_WORKSPACE\signing.jks",
            [Convert]::FromBase64String('${{ secrets.WORDNEST_KEYSTORE_B64 }}')
          )

      - name: Validate platform selection
        shell: pwsh
        run: |
          $android = '${{ github.event_name == 'push' || inputs.build_android }}'
          $windows = '${{ github.event_name == 'push' || inputs.build_windows }}'
          if ($android -ne 'true' -and $windows -ne 'true') {
            Write-Error 'At least one platform (Android or Windows) must be selected.'
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install pefile (cross-platform PE version reader)
        run: pip install pefile

      - name: Install Inno Setup 6
        run: choco install innosetup -y

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare release (lock source snapshot)
        run: python packaging/release_helpers.py prepare --public

      - name: Build Android APK (arm64-v8a, release-signed)
        if: ${{ github.event_name == 'push' || inputs.build_android }}
        run: flutter build apk --release --split-per-abi

      - name: Upload Android APK (workflow artifact)
        if: ${{ github.event_name == 'push' || inputs.build_android }}
        uses: actions/upload-artifact@v4
        with:
          name: wordnest-android-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Build Windows release
        if: ${{ github.event_name == 'push' || inputs.build_windows }}
        run: flutter build windows --release

      - name: Upload Windows build (workflow artifact)
        if: ${{ github.event_name == 'push' || inputs.build_windows }}
        uses: actions/upload-artifact@v4
        with:
          name: wordnest-windows-release
          path: build/windows/x64/runner/Release
          if-no-files-found: error

      # The prepare/record/package receipt flow requires a complete dual-platform
      # build, so the validated installer + portable + signed APK release is only
      # produced when both platforms are built.
      - name: Record release (validate builds + write receipt)
        if: ${{ (github.event_name == 'push') || (inputs.build_android && inputs.build_windows) }}
        run: python packaging/release_helpers.py record --public

      - name: Package release (installer + portable + APK)
        if: ${{ (github.event_name == 'push') || (inputs.build_android && inputs.build_windows) }}
        run: python packaging/windows/package.py --public --output-dir dist

      - name: Create GitHub Release
        if: ${{ (github.event_name == 'push' || inputs.create_release) && ((github.event_name == 'push') || (inputs.build_android && inputs.build_windows)) }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WordNest-windows-x64-setup.exe
            dist/WordNest-windows-x64-portable.zip
            dist/WordNest-android.apk
          body: |
            ## WordNest ${{ github.ref_name }}

            - **Android** — arm64-v8a APK (release-signed)
            - **Windows** — x64 installer + portable ZIP

            安装前请先阅读包内 USAGE.txt。
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
