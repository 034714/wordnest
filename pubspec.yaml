name: wordnest
description: "词栖 · 本地优先的轻量记词工具"
publish_to: none
version: 0.3.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0+2
  shared_preferences: ^2.5.4
  csv: ^6.0.0
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  hotkey_manager: ^0.2.3
  launch_at_startup: ^0.5.1
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.1
  timezone: ^0.11.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.13

flutter:
  uses-material-design: true
  assets:
    - assets/cet4-kylebing.txt
    - assets/KYLEBING-LICENSE.txt
    - assets/cet4-kylebing.provenance.json
    - assets/catalog-manifest.json
    - assets/dictionary.json
    - assets/ECDICT-LICENSE.txt
    - assets/tray.ico

msix_config:
  display_name: 词栖 WordNest
  publisher_display_name: WordNest
  identity_name: io.wordnest.wordnest
  msix_version: 0.3.0.0
  capabilities: internetClient
